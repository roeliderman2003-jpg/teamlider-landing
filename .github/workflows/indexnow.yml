name: IndexNow ping

# Notifies Bing/IndexNow the moment pages change, so ChatGPT Search (Bing-backed)
# and Copilot pick them up fast. Keyless protocol — the key file at the domain root
# (65be6ce801a1b48106f3830efca3c936.txt) is the only credential.
on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'sitemap.xml'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Submit URLs to IndexNow
        run: |
          curl -sS -X POST 'https://api.indexnow.org/indexnow' \
            -H 'Content-Type: application/json; charset=utf-8' \
            --data '{
              "host": "teamlider.co.il",
              "key": "65be6ce801a1b48106f3830efca3c936",
              "keyLocation": "https://teamlider.co.il/65be6ce801a1b48106f3830efca3c936.txt",
              "urlList": [
                "https://teamlider.co.il/",
                "https://teamlider.co.il/kids.html",
                "https://teamlider.co.il/women.html",
                "https://teamlider.co.il/men.html",
                "https://teamlider.co.il/adults.html",
                "https://teamlider.co.il/guide.html"
              ]
            }' -w '\nIndexNow HTTP %{http_code}\n'
